<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="user_login.css">
</head>
<body>
    <div class="container">
        <form class="form-card" action="/user/register" method="POST">
            <h1>Fill General Details</h1>
            <div class="form-group">
                <label for="name">
                    Name <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    placeholder="Enter your name"
                >
            </div>
            <div class="form-group">
                <label for="institute">
                    Institute Name <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="institute" 
                    name="institute" 
                    required 
                    placeholder="Enter institute name"
                >
            </div>

            <div class="form-group">
                <label for="mobile">
                    Mobile Number <span class="required">*</span>
                </label>
                <input 
                    type="tel" 
                    id="mobile" 
                    name="mobile" 
                    required 
                    pattern="[0-9]{10}"
                    placeholder="Enter mobile number"
                >
            </div>

            <div class="form-group">
                <label for="participate">
                    Participate As: <span class="required">*</span>
                </label>
                <select id="participate" name="participate" required>
                    <option value="" disabled selected>Select</option>
                    <option value="individual1">Individual</option>
                    <option value="team">Team</option>
                    <option value="individual2">Individual</option>
                </select>
            </div>

            <a href="dashboard.html" class="button">Submit</a>
        </form>
    </div>
</body>
</html>
