<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportech - Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000; 
            backdrop-filter: blur(10px); 
            background-color: rgba(51, 51, 51, 0.7); 
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .nav-links li {
            margin-left: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #00bcd4;
        }

        body {
            padding-top: 60px; 
            background-color: skyblue;
        }

        .dashboard-section {
            display: none; 
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Sportech</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="live_score.html" id="live-scores-link">Live Scores</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="Dashboard.html" id="dashboard-link" >Dashboard</a></li>
                <li id="auth-link"><a href="login.html">Login/Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="score-display">
            <h3>Current Score</h3>
            <p id="score-value">Hello Brother!</p>
        </section>

        <section class="admin-section" id="admin-options" style="display: none;">
            <h2>Admin Panel</h2>
            <input type="text" id="score-input" placeholder="Enter new score">
            <button id="update-score-btn">Update Score</button>
        </section>

        <!-- Dashboard Section -->
       
    </main>

    <footer>
        &copy; 2025 Sportech, IIT Delhi. All rights reserved.
    </footer>

    <script>
        async function checkLoginStatus() {
    try {
        const response = await fetch('/is-logged-in');
        const data = await response.json();

        console.log('Login Status Response:', data);  // Debug log to see the response

        const authLink = document.getElementById('auth-link');
        const dashboardLink = document.getElementById('dashboard-link');
        const adminOptions = document.getElementById('admin-options');
        const dashboardSection = document.getElementById('dashboard-section');

        if (data.loggedIn) {
            console.log('User is logged in');  // Debug log

            const roleText = data.user.role === 'admin' ? '(Admin)' : '(User)';
            authLink.innerHTML = `<a href="#" id="logout-btn">Logout ${roleText}</a>`;

            // Show dashboard link after login
            dashboardLink.style.display = 'block';
            dashboardSection.style.display = 'block';

            if (data.user.role === 'admin') {
                adminOptions.style.display = 'block'; // Show admin options
            } else {
                adminOptions.style.display = 'none';
            }

            document.getElementById('logout-btn').addEventListener('click', async (e) => {
                e.preventDefault();
                await fetch('/logout', { method: 'POST' });
                window.location.reload();
            });

        } else {
            console.log('User is not logged in');  // Debug log

            // Hide dashboard link and section if not logged in
            dashboardLink.style.display = 'none';
            dashboardSection.style.display = 'none';
            authLink.innerHTML = '<a href="login.html">Login/Register</a>';
        }

    } catch (error) {
        console.error('Error checking login status:', error);
    }
}

checkLoginStatus();

    </script>
</body>
</html>
